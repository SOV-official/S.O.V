<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes</title>
    <link rel="icon" type="image/png" href="utu.png">
    <link rel="stylesheet" href="reportes.css">
</head>

<body>

    <button onclick="window.location.href='menu.html'" class="btn-volver">
        ← Volver al Menú
    </button>

    <main class="contenedor">

        <header>
            <h1>Reportes del Sistema</h1>
        </header>

        <section class="reporte-seccion">

            <h2>Estadísticas Generales</h2>

            <table>
                <tr>
                    <th>Concepto</th>
                    <th>Cantidad</th>
                </tr>

                <tr>
                    <td>Equipos Totales</td>
                    <td><input type="number" value="120"></td>
                </tr>

                <tr>
                    <td>Equipos Prestados</td>
                    <td><input type="number" value="35"></td>
                </tr>

                <tr>
                    <td>Usuarios Registrados</td>
                    <td><input type="number" value="58"></td>
                </tr>

                <tr>
                    <td>Tickets Activos</td>
                    <td><input type="number" value="12"></td>
                </tr>
            </table>

        </section>

        <section class="reporte-seccion">

            <h2>Préstamos por Mes</h2>

            <table>
                <tr>
                    <th>Mes</th>
                    <th>Préstamos</th>
                </tr>

                <tr>
                    <td>Enero</td>
                    <td><input type="number" value="42"></td>
                </tr>

                <tr>
                    <td>Febrero</td>
                    <td><input type="number" value="38"></td>
                </tr>

                <tr>
                    <td>Marzo</td>
                    <td><input type="number" value="55"></td>
                </tr>

                <tr>
                    <td>Abril</td>
                    <td><input type="number" value="49"></td>
                </tr>
            </table>

        </section>

        <section class="reporte-seccion">

            <h2>Equipos Más Utilizados</h2>

            <table>
                <tr>
                    <th>N° Equipo</th>
                    <th>Cantidad de Préstamos</th>
                </tr>

                <tr>
                    <td>PC-001</td>
                    <td><input type="number" value="25"></td>
                </tr>

                <tr>
                    <td>PC-015</td>
                    <td><input type="number" value="22"></td>
                </tr>

                <tr>
                    <td>PC-008</td>
                    <td><input type="number" value="19"></td>
                </tr>
            </table>

        </section>

        <section class="reporte-seccion">

            <h2>Acciones Rápidas</h2>

            <button class="btn-reporte">Exportar Reporte PDF</button>
            <button class="btn-reporte">Exportar Reporte Excel</button>
            <button class="btn-reporte">Imprimir Reporte</button>

        </section>

    </main>

</body>

</html>
