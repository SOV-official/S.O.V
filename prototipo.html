<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Laboratorio</title>
    <link rel="stylesheet" href="assets/css/protipo.css">
    <link rel="icon" type="image/jpeg" href="utu.png">
</head>

<body>

    <button onclick="window.location.href='menu.html'" class="btn-volver">
        ← Volver al Menu
    </button>

    <h1>Planilla de Registro de Laboratorio / Taller</h1>

    <form onsubmit="guardarDatos(event)">

        <section class="fila">

            <figure>
                <figcaption>Laboratorio / Taller</figcaption>

                <select id="laboratorio">
                    <option>Laboratorio 1</option>
                    <option>Laboratorio 2</option>
                    <option>Laboratorio 3</option>
                    <option>Laboratorio 4</option>
                    <option>Laboratorio 5</option>
                    <option>Laboratorio 6</option>
                    <option>Taller Informática</option>
                    <option>Taller Electrónica</option>
                </select>
            </figure>

            <figure>
                <figcaption>Asignatura</figcaption>

                <input type="text" id="asignatura" placeholder="Ingrese asignatura">
            </figure>

            <figure>
                <figcaption>Docente</figcaption>

                <input type="text" id="docente" placeholder="Nombre del docente">
            </figure>

        </section>

        <section class="fila">

            <figure>
                <figcaption>Fecha</figcaption>

                <input type="date" id="fecha">
            </figure>

            <figure>
                <figcaption>Hora de salida</figcaption>

                <input type="time" id="horaSalida">
            </figure>

            <figure>
                <figcaption>Grupo</figcaption>

                <input type="text" id="grupo" placeholder="Grupo">
            </figure>

        </section>

        <section class="fila">

            <figure>
                <figcaption>Turno</figcaption>

                <select id="turno">
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Nocturno</option>
                </select>
            </figure>

            <figure>
                <figcaption>Estado del equipo</figcaption>

                <select id="estadoEquipo">
                    <option>Buen estado</option>
                    <option>Con fallas</option>
                    <option>Fuera de servicio</option>
                </select>
            </figure>

            <figure>
                <figcaption>Estudiante que informó</figcaption>

                <input type="text" id="estudiante" placeholder="Nombre y apellido">
            </figure>

        </section>

        <section class="fila">

            <figure>
                <figcaption>Números de Equipos</figcaption>

                <input type="text" id="numeroEquipo" placeholder="Ej: 12, 15, 18, 22, 30">
            </figure>

        </section>

        <button type="submit" class="btn">Guardar Registro</button>

        <button type="reset" class="btn">Borrar Registro</button>

    </form>
    <script src="assets/js/prototipo.js"></script>
</html>
