<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Usuarios</title>
<link rel="stylesheet" href="gestion_ticket.css">
<link rel="icon" href="utu.png">

</head>

<body>
<a href="menu.html" class="btn-volver">← Volver al menú</a>
<div class="contenedor">

    <h1>Gestión de Usuarios</h1>

    <div class="campo">
        <label>Nombre</label>
        <input type="text" id="nombre">
    </div>

    <div class="campo">
        <label>Correo Electrónico</label>
        <input type="email" id="correo">
    </div>

    <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password">
    </div>

    <button onclick="guardarUsuario()">Registrar Usuario</button>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
    </table>

</div>

<script>

let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

mostrarUsuarios();

function guardarUsuario(){

    const nombre = document.getElementById("nombre").value;
    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;

    if(nombre === "" || correo === "" || password === ""){
        alert("Complete todos los campos");
        return;
    }

    usuarios.push({
        nombre,
        correo,
        password
    });

    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    document.getElementById("nombre").value = "";
    document.getElementById("correo").value = "";
    document.getElementById("password").value = "";

    mostrarUsuarios();
}

function mostrarUsuarios(){

    const tabla = document.getElementById("tablaUsuarios");

    tabla.innerHTML = "";

    usuarios.forEach((usuario,index)=>{

        tabla.innerHTML += `
            <tr>
                <td>${usuario.nombre}</td>
                <td>${usuario.correo}</td>
                <td>
                    <button class="eliminar" onclick="eliminarUsuario(${index})">
                        Eliminar
                    </button>
                </td>
            </tr>
        `;
    });
}

function eliminarUsuario(index){

    usuarios.splice(index,1);

    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    mostrarUsuarios();
}

</script>

</body>
</html>
