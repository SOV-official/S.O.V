<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Servicio de PC</title>
<link rel="stylesheet" href="historial_servicio.css">
<link rel="icon" href="utu.png">
</head>

<body>

<a href="menu.html" class="btn-volver">← Volver al menú</a>

<div class="container">

    <h1>Historial de Servicio de PC</h1>

    <table>
        <thead>
            <tr>
                <th>Profesor</th>
                <th>Materia</th>
                <th>Tipo</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaServicio"></tbody>
    </table>

    <div id="vacio"></div>

</div>

<script>

let servicios = JSON.parse(localStorage.getItem("servicios")) || [];

let tabla = document.getElementById("tablaServicio");
let vacio = document.getElementById("vacio");

function guardar(){
    localStorage.setItem("servicios", JSON.stringify(servicios));
}

function mostrarServicios(){

    tabla.innerHTML = "";

    if(servicios.length === 0){
        vacio.innerHTML = "No hay servicios registrados";
        return;
    }

    vacio.innerHTML = "";

    servicios.forEach((s, index) => {

        tabla.innerHTML += `
            <tr>
                <td>${s.profesor}</td>
                <td>${s.materia}</td>
                <td>${s.tipo}</td>
                <td>${s.descripcion}</td>
                <td>${s.fecha}</td>
                <td>
                    <button onclick="editar(${index})">Editar</button>
                    <button onclick="eliminar(${index})">Eliminar</button>
                </td>
            </tr>
        `;

    });

}

function eliminar(index){

    if(confirm("¿Seguro que quieres eliminar este servicio?")){

        servicios.splice(index, 1);
        guardar();
        mostrarServicios();

    }

}

function editar(index){

    let s = servicios[index];

    let profesor = prompt("Profesor:", s.profesor);
    if(profesor === null) return;

    let materia = prompt("Materia:", s.materia);
    if(materia === null) return;

    let tipo = prompt("Tipo de servicio:", s.tipo);
    if(tipo === null) return;

    let descripcion = prompt("Descripción:", s.descripcion);
    if(descripcion === null) return;

    let fecha = prompt("Fecha:", s.fecha);
    if(fecha === null) return;

    servicios[index] = {
        profesor,
        materia,
        tipo,
        descripcion,
        fecha
    };

    guardar();
    mostrarServicios();

}

mostrarServicios();

</script>

</body>
</html>
