<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tickets</title>

    <link rel="stylesheet" href="assets/css/gestion_ticket.css">
    <link rel="icon" href="assets/img/utu.png" type="image/png">
</head>

<body>

    <button onclick="window.location.href='menu.html'" class="btn-volver">
        ← Volver al Menú
    </button>

    <div class="contenedor">

        <h1>Gestión de Tickets</h1>

        <div class="campo">
            <label>Nombre del Solicitante</label>
            <input type="text" id="nombre">
        </div>

        <div class="campo">
            <label>Grupo</label>
            <input type="text" id="grupo">
        </div>

        <div class="campo">
            <label>Número de Equipo</label>
            <input type="number" id="equipo">
        </div>

        <div class="campo">
            <label>Lugar de Uso</label>
            <select id="lugar">
                <option value="">Seleccione un lugar</option>
                <option>Laboratorio</option>
                <option>Taller</option>
            </select>
        </div>

        <div class="campo">
            <label>Motivo</label>
            <input type="text" id="motivo">
        </div>

        <button onclick="crearTicket()">
            Enviar Ticket
        </button>

    </div>
<script src="assets/js/gestion_tickets.js"></script>
