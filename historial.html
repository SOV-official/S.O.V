<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Registros</title>
    <link rel="icon" type="image/png" href="utu.png">
<link rel="stylesheet" href="historial.css">
</head>

<body>

    <div class="contenedor">

        <a href="menu.html" class="btn-volver">
            ← Volver al Menú
        </a>

        <h1>Historial de Registros</h1>

        <table id="tablaHistorial">

            <thead>
                <tr>
                    <th>Laboratorio</th>
                    <th>Asignatura</th>
                    <th>Docente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Grupo</th>
                    <th>Turno</th>
                    <th>Estado</th>
                    <th>Estudiante</th>
                    <th>Equipos</th>
                </tr>
            </thead>

            <tbody id="contenidoTabla">

            </tbody>

        </table>

    </div>

    <script>

        let historial = JSON.parse(localStorage.getItem("historial")) || [];

        let tabla = document.getElementById("contenidoTabla");

        if(historial.length === 0){

            tabla.innerHTML = `
                <tr>
                    <td colspan="10" class="sin-registros">
                        No hay registros guardados.
                    </td>
                </tr>
            `;
        }

        historial.forEach(registro => {

            tabla.innerHTML += `
                <tr>
                    <td>${registro.laboratorio}</td>
                    <td>${registro.asignatura}</td>
                    <td>${registro.docente}</td>
                    <td>${registro.fecha}</td>
                    <td>${registro.horaSalida}</td>
                    <td>${registro.grupo}</td>
                    <td>${registro.turno}</td>
                    <td>${registro.estadoEquipo}</td>
                    <td>${registro.estudiante}</td>
                    <td>${registro.numeroEquipo}</td>
                </tr>
            `;

        });

    </script>

</body>

</html>
