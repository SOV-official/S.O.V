<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historial de Tickets</title>

<link rel="icon" type="image/png" href="utu.png">
<link rel="stylesheet" href="historial_tickets.css">

</head>

<body>

<button onclick="window.location.href='menu.html'" class="btn-volver">
    ← Volver al Menú
</button>

<div class="container">

    <h1>Historial de Tickets</h1>

    <table>

        <thead>
            <tr>
                <th>Solicitante</th>
                <th>Grupo</th>
                <th>N° Equipo</th>
                <th>Lugar de Uso</th>
                <th>Motivo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaTickets">

        </tbody>

    </table>

</div>

<script>

var tickets = JSON.parse(localStorage.getItem("tickets")) || [];

mostrarTickets();

function mostrarTickets(){

    var tabla = document.getElementById("tablaTickets");

    tabla.innerHTML = "";

    if(tickets.length === 0){

        tabla.innerHTML =
        "<tr><td colspan='6' class='sin-registros'>No hay tickets registrados.</td></tr>";

        return;
    }

    for(var i = 0; i < tickets.length; i++){

        tabla.innerHTML +=
        "<tr>" +
        "<td>" + tickets[i].nombre + "</td>" +
        "<td>" + tickets[i].grupo + "</td>" +
        "<td>" + tickets[i].equipo + "</td>" +
        "<td>" + tickets[i].lugar + "</td>" +
        "<td>" + tickets[i].motivo + "</td>" +
        "<td>" +

        "<button onclick='editarTicket(" + i + ")'>✏️ Editar</button> " +

        "<button onclick='eliminarTicket(" + i + ")'>🗑️ Eliminar</button>" +

        "</td>" +
        "</tr>";

    }

}
